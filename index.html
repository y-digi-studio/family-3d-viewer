<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>家族用 3Dビューア</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1eb;color:#273b33;font-family:system-ui,sans-serif}#login{max-width:440px;margin:12vh auto;padding:30px;background:white;border-radius:16px}h1{font-size:24px}label{display:block;margin:18px 0 8px}input,button{font:inherit;padding:12px;border:1px solid #809489;border-radius:8px}input{width:100%}button{background:#344f40;color:white;cursor:pointer;margin-top:16px}#status{line-height:1.6}iframe{position:fixed;inset:42px 0 0;width:100%;height:calc(100% - 42px);border:0}#lock{position:fixed;top:0;right:16px;margin:2px;padding:6px 14px}#login[hidden],#lock[hidden]{display:none}</style><section id="login"><h1>家族用 3Dビューア</h1><p>家族共通のパスワードを入力してください。</p><form><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button id="open">3Dを開く</button></form><p id="status" role="status"></p></section><button id="lock" hidden>閉じてロック</button><script>
const config={"salt": "NeyZOiVRTiXPtozJ9L63FQ==", "iv": "rcYpTfbnw4dwaxxh", "parts": ["part0.bin", "part1.bin", "part2.bin", "part3.bin"]}, $=s=>document.querySelector(s), bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
$('form').onsubmit=async e=>{e.preventDefault();$('#open').disabled=true;$('#status').textContent='3Dデータを読み込んでいます…';try{if(!crypto.subtle)throw Error('このブラウザーでは開けません。HTTPSで最新のブラウザーをお使いください。');const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode($('#password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(config.salt),iterations:600000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);$('#password').value='';const parts=await Promise.all(config.parts.map(async p=>{const r=await fetch(p);if(!r.ok)throw Error('データを取得できません。通信状態を確認してください。');return new Uint8Array(await r.arrayBuffer())}));let n=0;const data=new Uint8Array(parts.reduce((s,p)=>s+p.length,0));for(const p of parts){data.set(p,n);n+=p.length}let html;try{html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(config.iv)},key,data))}catch(e){throw Error('パスワードが違うか、データが破損しています。')}const frame=document.createElement('iframe');frame.title='住宅3D';frame.srcdoc=html;document.body.append(frame);$('#login').hidden=true;$('#lock').hidden=false;$('#status').textContent='';}catch(e){$('#status').textContent=e.message}finally{$('#open').disabled=false}};
$('#lock').onclick=()=>location.reload();
</script></html>

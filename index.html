<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>りゅうととちひろの家｜新旧比較</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px system-ui;color:#263f32;background:#eef1e9}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:#fffef9;border-bottom:1px solid #cbd5c8}select,button{font:inherit;padding:9px;border:1px solid #aabaaa;border-radius:7px;background:white;color:inherit}label{white-space:nowrap}#status{font-size:12px;color:#5d6c5d}main{flex:1;min-height:0;position:relative}iframe{width:100%;height:100%;border:0;display:block}#busy{position:absolute;inset:0;background:#edf0e9e8;display:grid;place-items:center;z-index:6}#busy[hidden]{display:none}@media(max-width:700px){header{padding:6px;gap:6px;flex-wrap:wrap}header strong,#status{display:none}select{max-width:190px}label{font-size:12px}button{padding:8px}}</style><header><strong>りゅうととちひろの家</strong><select id="choice" aria-label="比較する案"><option value="0">以前の案・部屋割り1</option><option value="1">以前の案・部屋割り2</option><option value="2">11月22日の案</option><option value="3" selected>11月23日の新配置案</option></select><label><input id="keep" type="checkbox" checked> 視点を維持</label><button id="plan">平面図</button><span id="status" role="status">準備中</span></header><main id="host"><div id="busy">3Dを読み込んでいます…</div></main><script type="application/json" id="docs">[]</script><script>
const docs=JSON.parse(document.querySelector('#docs').textContent),host=document.querySelector('#host'),choice=document.querySelector('#choice'),busy=document.querySelector('#busy'),status=document.querySelector('#status');let frame=null,seq=0;
async function change(index){const ticket=++seq;let saved=null;if(frame){try{if(document.querySelector('#keep').checked)saved=frame.contentWindow.compareBridge.snapshot();frame.contentWindow.compareBridge.dispose()}catch(e){console.warn(e)}frame.remove()}busy.hidden=false;busy.textContent='3Dを読み込んでいます…';choice.disabled=true;document.querySelector('#plan').disabled=true;status.textContent='切り替え中';frame=document.createElement('iframe');frame.id='house';frame.title=choice.options[index].text;frame.onload=()=>{const deadline=performance.now()+60000;function check(){if(ticket!==seq)return;let api=frame.contentWindow.compareBridge;if(api?.ready()){requestAnimationFrame(()=>requestAnimationFrame(()=>{if(ticket!==seq)return;if(saved)api.apply(saved);else if(index<2){const s=api.snapshot();s.target=[6.5,.7,7];s.roof=true;s.scale=32*2*Math.tan(40*Math.PI/360)/frame.contentWindow.innerHeight;api.apply(s)}busy.hidden=true;choice.disabled=false;document.querySelector('#plan').disabled=false;status.textContent=saved?'角度・拡大率・中心位置を維持':'表示中';host.dataset.layout=index;window.compareReady=true;}))}else if(performance.now()<deadline)setTimeout(check,50);else{busy.textContent='読み込みを完了できませんでした。別の案を選ぶか再読み込みしてください。';choice.disabled=false}}check()};window.compareReady=false;try{if(!docs[index]){const response=await fetch(["layout-1-7935e00623.html", "layout-2-6f672503e0.html", "layout-3-c7993391c4.html", "layout-4-a506e0353e.html"][index]);if(!response.ok)throw Error('HTTP '+response.status);docs[index]=await response.text()}if(ticket!==seq)return;frame.srcdoc=docs[index];host.append(frame)}catch(e){busy.textContent='読み込みに失敗しました。再読み込みしてください。';choice.disabled=false;status.textContent=e.message}}
choice.onchange=()=>change(+choice.value);document.querySelector('#plan').onclick=()=>frame.contentWindow.compareBridge.plan();change(3);
</script></html>
